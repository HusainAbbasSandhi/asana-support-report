display_information:
  name: Tech Digest
  description: Daily digest of open Asana requests for the tech team
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: Tech Digest
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - users:read
      - users:read.email
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

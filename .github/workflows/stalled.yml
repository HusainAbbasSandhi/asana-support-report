name: Stalled conversations report

on:
  schedule:
    # Six tries: 13:57, 14:07, 14:17, 14:27, 14:37, 14:47 IST. The first scheduled run
    # that posts leaves a "sent today" marker; later tries see it and stop.
    - cron: "27,37,47,57 8 * * *"
    - cron: "7,17 9 * * *"
  repository_dispatch:
    # Fired on the minute by an external cron (cron-job.org); the GitHub schedule above is the backup.
    types: [stalled-report]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message in the log instead of posting to Slack"
        type: boolean
        default: false
      test_channel:
        description: "Post to #test-channel instead of #tech-cs-issues"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # save the once-a-day marker in the Actions cache

concurrency:
  group: stalled
  cancel-in-progress: false

jobs:
  stalled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Today's date (IST)
        id: day
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check if today's report was already posted
        id: sent
        if: github.event_name != 'workflow_dispatch' || (!inputs.test_channel && !inputs.dry_run)
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: sent-stalled-${{ steps.day.outputs.date }}
          lookup-only: true

      - uses: actions/checkout@v5
        if: steps.sent.outputs.cache-hit != 'true'

      - uses: actions/setup-python@v6
        if: steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Build and post stalled report
        if: steps.sent.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: src
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m digest_bot.main --report stalled ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_channel && '--test' || '' }}

      - name: Mark today's report as posted
        if: (github.event_name != 'workflow_dispatch' || (!inputs.test_channel && !inputs.dry_run)) && steps.sent.outputs.cache-hit != 'true'
        run: date -u > .sent-marker

      - name: Remember today's report was posted
        if: (github.event_name != 'workflow_dispatch' || (!inputs.test_channel && !inputs.dry_run)) && steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: sent-stalled-${{ steps.day.outputs.date }}

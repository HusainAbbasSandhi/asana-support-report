name: Daily tech requests digest

on:
  schedule:
    # 04:27 UTC = 09:57 IST, every day. Off the top of the hour, when GitHub's
    # scheduler is busiest and runs are often late or dropped.
    - cron: "27 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message in the log instead of posting to Slack"
        type: boolean
        default: false
      test_channel:
        description: "Post to #test-channel instead of #tech-cs-issues"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests run in tests.yml on every push, so a failing test never blocks the daily post.
      - name: Build and post digest
        env:
          PYTHONPATH: src
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m digest_bot.main --report daily ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_channel && '--test' || '' }}

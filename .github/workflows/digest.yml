name: Daily tech requests digest

on:
  schedule:
    # 04:57 UTC = 10:27 IST, every day. Off the top of the hour, when GitHub's
    # scheduler is busiest and runs are often late or dropped.
    - cron: "57 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message in the log instead of posting to Slack"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests run in tests.yml on every push, so a failing test never blocks the daily post.
      - name: Build and post digest
        env:
          PYTHONPATH: src
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m digest_bot.main ${{ inputs.dry_run && '--dry-run' || '' }}

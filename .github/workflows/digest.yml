name: Daily tech requests digest

on:
  schedule:
    # GitHub's scheduler is best-effort and sometimes skips a trigger, so we try
    # six times: 09:57, 10:07, 10:17, 10:27, 10:37, 10:47 IST. The first scheduled
    # run that posts leaves a "sent today" marker; later tries see it and stop,
    # so #tech-cs-issues gets exactly one digest per day. Times avoid :00, GitHub's busiest minute.
    - cron: "27,37,47,57 4 * * *"
    - cron: "7,17 5 * * *"
  repository_dispatch:
    # Fired on the minute by an external cron (cron-job.org); the GitHub schedule above is the backup.
    types: [daily-digest]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message in the log instead of posting to Slack"
        type: boolean
        default: false
      test_channel:
        description: "Post to #test-channel instead of #tech-cs-issues"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write   # save the once-a-day marker in the Actions cache

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Today's date (IST)
        id: day
        # GitHub's scheduler can start a backup run hours late (one fired at 00:26 IST and posted
        # under the next day's date). Scheduled runs only post inside the window; the cron-job.org
        # trigger and manual runs are never blocked.
        run: |
          echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
          now=$(TZ=Asia/Kolkata date +%H%M)
          if [ "${{ github.event_name }}" != "schedule" ] || { [ "$now" -ge 0950 ] && [ "$now" -le 1130 ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scheduled run started at $now IST, outside 0950-1130; not posting"
          fi

      # Every post to the real channel (scheduled, external trigger, or manual with the test box unticked)
      # checks and sets the marker, so #tech-cs-issues never gets two. Test-channel and dry runs skip it.
      - name: Check if today's digest was already posted
        id: sent
        if: github.event_name != 'workflow_dispatch' || (!inputs.test_channel && !inputs.dry_run)
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: sent-v2-daily-${{ steps.day.outputs.date }}
          lookup-only: true

      - uses: actions/checkout@v5
        if: steps.day.outputs.ok == 'true' && steps.sent.outputs.cache-hit != 'true'

      - uses: actions/setup-python@v6
        if: steps.day.outputs.ok == 'true' && steps.sent.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.day.outputs.ok == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      # Tests run in tests.yml on every push, so a failing test never blocks the daily post.
      - name: Build and post digest
        if: steps.day.outputs.ok == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          PYTHONPATH: src
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python -m digest_bot.main --report daily ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_channel && '--test' || '' }}

      # Only reached if the post succeeded (a failed post skips this, so the next try retries).
      - name: Mark today's digest as posted
        if: (github.event_name != 'workflow_dispatch' || (!inputs.test_channel && !inputs.dry_run)) && steps.day.outputs.ok == 'true' && steps.sent.outputs.cache-hit != 'true'
        run: date -u > .sent-marker

      - name: Remember today's digest was posted
        if: (github.event_name != 'workflow_dispatch' || (!inputs.test_channel && !inputs.dry_run)) && steps.day.outputs.ok == 'true' && steps.sent.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: sent-v2-daily-${{ steps.day.outputs.date }}
